<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bilhete Único</title>
    <link rel="stylesheet" href="../Styles/cadastro.css">
    <script src="../scripts/cadastro.js" defer></script>
</head>
<body>

    <div class="container">
        <form id="register-page-form">
            <h2>Criar Conta</h2>
            <p>Preencha os dados escolares</p>
            <input type="text" placeholder="Nome Completo" required>
            <input type="text" placeholder="RA ou CPF" required>
            <input type="password" placeholder="Crie uma senha" required>
            <button type="submit">Finalizar Cadastro</button>
            <p class="toggle-link">Já possui conta? <a href="index.html">Entrar</a></p>
        </form>
    </div>

</body>
</html>
